<!DOCTYPE html>
<html>
<head>
    <title>Digital Library - Books</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .book {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        .book h2 {
            color: #2c3e50;
        }

        .book p {
            color: #555;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            margin-right: 10px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

    
    </style>
</head>

<body>

<header>
    <h1>Digital Library</h1>
    <p>Online PDF Books</p>
</header>

<div class="container">

    <div class="book">
        <h2>HTML Basics</h2>
        <p>Learn the basics of HTML and web page creation.</p>

        <a href="https://html.spec.whatwg.org/print.pdf" target="_blank" class="btn">
            View PDF
        </a>

    </div>

    <div class="book">
        <h2>CSS Basics</h2>
        <p>Learn CSS styling and web page design.</p>

        <a href="https://dl.ebooksworld.ir/motoman/Manning.CSS.in.Depth.www.EBooksWorld.ir.pdf" target="_blank" class="btn">
            View PDF
        </a>

    </div>

    <div class="book">
        <h2>JavaScript Basics</h2>
        <p>Learn JavaScript programming fundamentals.</p>

        <a href="https://polito-webapp1.github.io/material-2025/slide/1-01-javascript-basics.pdf" target="_blank" class="btn">
            View PDF
        </a>

    </div>

</div>

</body>
</html>
