<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url("assets/library image.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #f2f4f7;
            color: #333;
        }

        header {
            background-color: #1e3a5f;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .welcome-container {
            background-color: rgba(255, 255, 255, 0.88);
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .library-image {
            width: 250px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin: 20px 0;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background-color: #1e3a5f;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #162d49;
        }

        footer {
            background-color: #1e3a5f;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Digital Library Management System</h1>
    </header>

    <main>
        <div class="welcome-container">

            <h2>Welcome to Digital Library</h2>

            <p>
                Welcome to our Digital Library Management System.
                This system helps users access and manage digital
                books easily and efficiently.
            </p>

            <a href="login.html" class="btn">Get Started</a>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Digital Library Management System</p>
    </footer>

</body>
</html>
