<!DOCTYPE html>
<html>
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Reports</title>
</head>
<body>

    <style>
    * {
    box-sizing: border-box;
}
body {
    font-family: Arial, sans-serif;
    background: #f0f3f7;
    margin: 0;
    padding: 30px;
}

.container {
    width: 90%;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px #ccc;
}

h1, h2 {
    text-align: center;
    color: #1e3a5f;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin: 30px 0;
}

.card {
    background: #b9ebf3;
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
}

.card p {
    font-size: 30px;
    font-weight: bold;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #c0f7f6;
    color: white;
}

button {
    display: block;
    margin: 25px auto;
    padding: 12px 25px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #217dbb;
}

@media(max-width: 700px) {
    .dashboard {
        grid-template-columns: repeat(2, 1fr);
    }

    .container {
        width: 95%;
        padding: 10px;
        overflow-x: auto;
    }
}

    </style>

    <div class="container">

        <h1>Digital Library Management</h1>
        <h2>Library Reports</h2>

        <div class="dashboard">

            <div class="card">
                <h3>Total Books</h3>
                <p id="totalBooks">0</p>
            </div>

            <div class="card">
                <h3>Total Members</h3>
                <p id="totalMembers">0</p>
            </div>

            <div class="card">
                <h3>Issued Books</h3>
                <p id="issuedBooks">0</p>
            </div>

            <div class="card">
                <h3>Available Books</h3>
                <p id="availableBooks">0</p>
            </div>

        </div>

        <h2>Issued Book Report</h2>

        <table>
            <thead>
                <tr>
                    <th>Member Name</th>
                    <th>Book Name</th>
                    <th>Issue Date</th>
                </tr>
            </thead>

            <tbody id="reportList"></tbody>
        </table>

        <button onclick="window.print()">Print Report</button>

    </div>

    <script>
let books = JSON.parse(localStorage.getItem("books")) || [];

let members = JSON.parse(localStorage.getItem("members")) || [];

let issues = JSON.parse(localStorage.getItem("issues")) || [];

function generateReport() {

    let totalBooks = books.reduce(
        (sum, book) => sum + Number(book.quantity || 0), 0
    );

    let totalMembers = members.length;

    let issuedBooks = issues.length;

    let availableBooks = totalBooks;

    document.getElementById("totalBooks").innerHTML =
        totalBooks + issuedBooks;

    document.getElementById("totalMembers").innerHTML =
        totalMembers;

    document.getElementById("issuedBooks").innerHTML =
        issuedBooks;

    document.getElementById("availableBooks").innerHTML =
        availableBooks;

    let list = document.getElementById("reportList");

    list.innerHTML = "";

    issues.forEach(issue => {

        list.innerHTML += `
            <tr>
                <td>${issue.member}</td>
                <td>${issue.book}</td>
                <td>${issue.date}</td>
            </tr>

window.location.href = "dashboard.html";
        `;      
        }   
    );  

generateReport();


    </script>

</body>
</html>
