<!DOCTYPE html>
<html>
<head>
    <title>Issue Book - Digital Library</title>
    <link rel="stylesheet" href="issue.css">
</head>
<body>
    <style>
body  {
    font-family: Arial, sans-serif;
    background: #f0f3f7;
    margin: 0;
    padding: 30px;
}

.container {
    width: 85%;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px #ccc;
}

h1, h2 {
    text-align: center;
    color: #1e3a5f;
}

.form {
    width: 60%;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

input, select {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 12px;
    background: #1e3a5f;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #3498db;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #1e3a5f;
    color: white;
}

.return-btn {
    background: #e74c3c;
}

#message {
    text-align: center;
    font-weight: bold;
}

@media(max-width: 600px) {
    .container {
        width: 95%;
        padding: 10px;
    }

    .form {
        width: 100%;
    }

    table {
        font-size: 12px;
    }
}

    </style>

    <div class="container">

        <h1>Digital Library Management</h1>
        <h2>Issue Book</h2>

        <div class="form">

            <label>Select Member</label>
            <select id="member">
                <option value="">Select Member</option>
                <option value="Sharan">Sharan</option>
                <option value="Raja">Raja</option>
                <option value="Kumar">Kumar</option>
            </select>

            <label>Select Book</label>
            <select id="book">
                <option value="">Select Book</option>
                <option value="JavaScript">JavaScript</option>
                <option value="HTML">HTML</option>
                <option value="Python">Python</option>
            </select>

            <label>Issue Date</label>
            <input type="date" id="issueDate">

            <button onclick="issueBook()">Issue Book</button>

            <p id="message"></p>

        </div>

        <h2>Issued Book Details</h2>

        <table>
            <thead>
                <tr>
                    <th>Member</th>
                    <th>Book</th>
                    <th>Issue Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="issueList"></tbody>
        </table>

    </div>

    <script>
        
let books = JSON.parse(localStorage.getItem("issue books")) || [
    { name: "JavaScript", quantity: 5 },
    { name: "HTML", quantity: 3 },
    { name: "Python", quantity: 4 }
];

let issues = JSON.parse(localStorage.getItem("issues")) || [];

function issueBook() {

    let member = document.getElementById("member").value;
    let book = document.getElementById("book").value;
    let date = document.getElementById("issueDate").value;

    let message = document.getElementById("message");

    if (member === "" || book === "" || date === "") {
        message.innerHTML = "Please fill all fields!";
        message.style.color = "red";
        return;
    }

    let selectedBook = books.find(b => b.name === book);

    if (!selectedBook || selectedBook.quantity <= 0) {
        message.innerHTML = "Book Not Available!";
        message.style.color = "red";
        return;
    }

    selectedBook.quantity--;

    let issue = {
        member: member,
        book: book,
        date: date
    };

    issues.push(issue);

    localStorage.setItem("books", JSON.stringify(books));
    localStorage.setItem("issues", JSON.stringify(issues));

    message.innerHTML = "Book Issued Successfully!";
    message.style.color = "green";

    displayIssues();
}

function displayIssues() {

    let list = document.getElementById("issueList");

    list.innerHTML = "";

    issues.forEach((issue, index) => {

        list.innerHTML += `
            <tr>
                <td>${issue.member}</td>
                <td>${issue.book}</td>
                <td>${issue.date}</td>
                <td>
                    <button class="return-btn"
                    onclick="deleteIssue(${index})">
                    Delete
                    </button>
                </td>
            </tr>
        `;
    });
}

function deleteIssue(index) {

    if (confirm("Are you sure you want to delete this issue?")) {

        issues.splice(index, 1);

        localStorage.setItem("issues", JSON.stringify(issues));

        displayIssues();

        window.location.href = "dashboard.html";
    }
}

displayIssues();

    </script>

</body>
</html>
